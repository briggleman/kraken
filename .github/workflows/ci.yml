name: ci

# Build, lint, and test on every pull request (and pushes to main).
# The weekly Docker image rebuild lives in steam-images.yml, not here.
on:
  pull_request:
    # `edited` matters: the default types are [opened, synchronize, reopened],
    # so correcting a non-conventional PR title never re-runs the title check
    # and the PR stays red until someone pushes an unrelated commit. The
    # expensive jobs below opt out of `edited` so a title or body tweak doesn't
    # rebuild and retest everything.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Enforce Conventional Commits on PR titles — release-please reads these on
  # merge to main to compute the SemVer bump + generate CHANGELOG entries.
  # Since PRs land squash-merged, the PR title BECOMES the commit message.
  pr-title:
    name: pr title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" starts with an uppercase character.
            Conventional Commits subjects are lowercase (e.g. "feat: add BepInEx toggle"
            not "feat: Add BepInEx toggle").

  go:
    # Short and stable on purpose — this name is a branch-protection contract
    # (see .github/required-checks.txt). Detail belongs in the step names.
    name: go
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    # Postgres so the store integration tests run for real (they self-migrate
    # and skip only when KRAKEN_TEST_DATABASE_URL is unset).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kraken
          POSTGRES_PASSWORD: kraken
          POSTGRES_DB: kraken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kraken -d kraken"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KRAKEN_TEST_DATABASE_URL: postgres://kraken:kraken@localhost:5432/kraken?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build the web UI first so //go:embed all:dist picks up real assets.
      # Vite writes into internal/panel/webui/dist (see web/vite.config.ts).
      - name: web build
        run: npm ci && npm run build
        working-directory: web

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: cross-compile Windows agent
        run: GOOS=windows GOARCH=amd64 go build ./cmd/agent

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: test
        run: go test -race ./...

  web:
    # Short and stable on purpose — see the go job above and
    # .github/required-checks.txt.
    name: web
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Renaming a required job silently blocks every future PR: protection
      # matches by exact string, so the check simply never reports and the PR
      # waits at "Expected" forever, with nothing in the run pointing at the
      # cause (#136). Fail here instead, where the message can say what to do.
      - name: branch-protection contract (required check names)
        run: |
          missing=0
          while IFS= read -r name; do
            case "$name" in ''|'#'*) continue ;; esac
            if ! grep -qxF "    name: $name" .github/workflows/ci.yml; then
              echo "::error file=.github/required-checks.txt::required check \"$name\" is not declared as a job name in .github/workflows/ci.yml. Branch protection matches by exact string, so main is now unmergeable. Either restore the job name or update BOTH branch protection and .github/required-checks.txt."
              missing=1
            fi
          done < .github/required-checks.txt
          exit $missing

      - name: install
        run: npm ci
        working-directory: web

      - name: design drift gate (house.css matches the committed mock)
        run: npm run check:design
        working-directory: web

      - name: csp gate (no inline style attributes)
        run: npm run check:csp
        working-directory: web

      - name: build (svelte-check && vite build)
        run: npm run build
        working-directory: web
