name: release-please

# Google's release-please: read Conventional Commits merged to main, maintain
# an open "chore(main): release X.Y.Z" PR that accumulates the pending
# changelog + version bump. Merging that PR tags the release + creates the
# GitHub Release + updates CHANGELOG.md and internal/shared/version/version.go.
#
# When release-please cuts a release, we chain the release-binaries and
# release-images workflows inline (via workflow_call). This is necessary
# because GitHub blocks the default GITHUB_TOKEN from triggering downstream
# workflows via the `release: published` event (recursion prevention), so
# a plain `on: release` trigger on those workflows never fires. Chaining
# them here keeps everything in one workflow run and inherits the token.
#
# Bump rules (pre-1.0, bump-minor-pre-major=true):
#   feat!:  / BREAKING CHANGE:  →  minor bump (0.1.0 → 0.2.0, not forced to 1.0)
#   feat:                        →  minor bump
#   fix:                         →  patch bump
#   others (docs, chore, ci, …)  →  no version bump, but included in notes
on:
  push:
    branches: [main]

permissions:
  # release-please needs contents+PR write. Downstream reusable workflows
  # additionally need contents:write (upload release assets) and
  # packages:write (push to GHCR). Called workflows cannot exceed the
  # caller's permissions, so all required scopes are declared here.
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The wiki under docs/wiki is committed output: every page embeds the
      # Panel version from internal/shared/version/version.go and the releases
      # page is generated from CHANGELOG.md. A release PR rewrites both, so the
      # committed wiki goes stale on its branch and the ci workflow's drift
      # gate refuses the PR. Regenerate on the release branch and push the
      # result back, the same way release-please keeps the branch current.
      # Skipped entirely when there is no open release PR.
      - uses: actions/checkout@v4
        if: ${{ steps.rp.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}

      - uses: actions/setup-node@v4
        if: ${{ steps.rp.outputs.pr }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: regenerate the wiki for the release version
        if: ${{ steps.rp.outputs.pr }}
        run: |
          npm ci --prefix web
          node web/scripts/build-wiki.mjs
          if git diff --quiet -- docs/wiki; then
            echo "docs/wiki already matches the release version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wiki
          git commit -m "chore(wiki): regenerate for the release version"
          git push

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-images.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
