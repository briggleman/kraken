openapi: 3.0.3
info:
  title: Kraken Panel API
  description: >
    Control-plane REST API for the Kraken self-hosted game-server platform:
    authentication, the game-spec catalog, server lifecycle, files, backups,
    cron schedules, node registry, Agent mTLS enrollment, users/roles, and the
    audit log. All endpoints are under /api/v1 unless noted. Authenticated
    endpoints use a bearer session token from POST /auth/login.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Panel API (relative to the Panel host)
tags:
  - name: Auth
  - name: Servers
  - name: Specs
  - name: Nodes
  - name: Files
  - name: Backups
  - name: Schedules
  - name: Users & Roles
  - name: Enrollment
  - name: Setup
  - name: Settings
  - name: DNS
  - name: Audit
  - name: Meta
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a session token
      description: >
        Rate limited per source IP (20 a minute, burst 20) — generous enough
        that a whole team behind one NAT address can sign in normally, tight
        enough to put a ceiling on scripted guessing. A refusal is a 429 with
        Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: "Too many login attempts from this address; retry after the Retry-After header says" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the current session
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and role
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  role: { type: object }
  /version:
    get:
      tags: [Meta]
      summary: Panel build version
      description: >-
        The Panel's own build. Shown as the version stamp in the UI and compared
        against each node's agent_version to surface fleet version skew.
        Authenticated, so an unauthenticated caller can't fingerprint the build.
      responses:
        '200':
          description: Build metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 0.13.0 }
                  commit: { type: string }
                  date: { type: string }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      description: >-
        Rotates the caller's password, clears the first-run must-change flag, and
        issues a fresh session token (the old bearer is invalidated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Password changed; returns a rotated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Current password incorrect }

  /setup/status:
    get:
      tags: [Setup]
      summary: First-run onboarding progress
      description: >-
        The whole /setup/* surface answers only requests whose source IP falls
        inside KRAKEN_SETUP_ALLOWED_CIDRS (default: loopback + private ranges);
        external sources receive 403 regardless of credentials.
        setup_complete latches true permanently once onboarding finishes
        (computed complete once, or explicitly dismissed).
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_must_change_password: { type: boolean }
                  using_memory: { type: boolean }
                  has_node_online: { type: boolean }
                  has_spec: { type: boolean }
                  has_server: { type: boolean }
                  setup_complete: { type: boolean }
        '403': { description: Source IP outside the setup allowlist }
  /setup/dismiss:
    post:
      tags: [Setup]
      summary: Mark first-run onboarding as finished (hides the Setup shortcut permanently)
      responses:
        '200':
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_complete: { type: boolean }
        '403': { description: Source IP outside the setup allowlist }
  /setup/database:
    get:
      tags: [Setup]
      summary: Current datastore target (never returns the password)
      responses:
        '200':
          description: Datastore config
          content:
            application/json:
              schema:
                type: object
                properties:
                  using_memory: { type: boolean }
                  env_locked: { type: boolean, description: "managed by KRAKEN_DATABASE_URL" }
                  host: { type: string }
                  port: { type: integer }
                  user: { type: string }
                  dbname: { type: string }
                  sslmode: { type: string }
    post:
      tags: [Setup]
      summary: Connect Postgres — create DB if needed, migrate, persist, restart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DBConnectRequest' }
      responses:
        '200':
          description: Saved; the Panel will restart onto Postgres
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarting: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Database is env-managed (KRAKEN_DATABASE_URL) }
        '502': { description: Connection / create / migrate failed }
  /setup/database/test:
    post:
      tags: [Setup]
      summary: Preflight a Postgres connection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DBConnectRequest' }
      responses:
        '200':
          description: Reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  db_exists: { type: boolean }
                  can_create_db: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: Connection failed }
  /setup/local-enroll:
    post:
      tags: [Setup]
      security: []
      summary: Issue a bootstrap token for the co-located Agent (loopback only)
      description: >-
        Mints a one-time enrollment token for the local single-host Agent. Gated on
        a loopback source IP; not reachable off-host.
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapToken' }
        '403': { description: Not called from the Panel host }
        '503': { description: Agent enrollment not configured }
  /catalog:
    get:
      tags: [Setup]
      summary: List bundled starter game specs
      responses:
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
  /catalog/{id}/import:
    post:
      tags: [Setup]
      summary: Import a bundled catalog spec (one-click)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spec' }
        '404': { description: Catalog item not found }
        '409': { description: A spec with that slug is already imported }

  /servers:
    get:
      tags: [Servers]
      summary: List servers
      responses:
        '200':
          description: Servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items: { $ref: '#/components/schemas/Server' }
    post:
      tags: [Servers]
      summary: Create (deploy) a server from a spec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec_id, name]
              properties:
                spec_id: { type: string, format: uuid }
                name: { type: string }
                variables:
                  type: object
                  additionalProperties: { type: string }
                memory_mb:
                  type: integer
                  description: >-
                    Memory to reserve. Omit to take the spec's own figure — its
                    recommended memory, falling back to the minimum. An explicit
                    value must be at least the spec's min_memory_mb: below that
                    floor the game does not boot.
                node_id:
                  type: string
                  format: uuid
                  description: >-
                    Pin placement to one node. The scheduler still checks
                    eligibility and reserves; an ineligible pin is a 409 naming
                    the reason rather than a silent placement elsewhere.
                install_bepinex:
                  type: boolean
                  description: Honored only when the spec is bepinex_compatible.
                pin_build:
                  type: boolean
                  description: >-
                    Pin the server to the build this install pulls: no update
                    pass runs before later starts. Default false — every
                    operator-initiated start/restart re-runs the install script
                    first so the game picks up depot updates.
                steam_guard_code:
                  type: string
                  description: One-time 2FA code for specs whose install needs an authenticated Steam login. Used for this install only, never persisted.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /servers/{id}:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Servers]
      summary: Get a server
      responses:
        '200':
          description: Server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Servers]
      summary: Delete a server, its world and config, and its schedules
      description: >-
        Removes the server's containers and data directory on its node, releases
        its memory and ports, and deletes the record together with its schedules.
        Backup archives are kept.


        A removal that cannot reach the node — the node is unreachable, or its
        Agent reports a failure — does not block the delete. It is recorded on the
        node as a pending removal (see Node.pending_removals) that keeps the
        server's memory and ports allocated, and the Panel's node reconciler
        retries it with backoff until the node confirms; the allocation is
        released then. A delete whose removal cannot be recorded is refused.
      responses:
        '204': { description: Deleted (the node-side removal may still be pending) }
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: The server's node could not be read, or the removal could not be recorded on it; nothing was deleted.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /servers/{id}/power:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Servers]
      summary: Power action (start/stop/restart/kill)
      description: >
        Start and restart re-run the server's install script before launching,
        so the game picks up depot updates, unless one of these skips it: the
        server pins its build, the spec sets skip_update_on_start (per spec or
        per platform), the server's create or reinstall completed within the
        last 30 minutes (so the pass would only repeat it), or the spec needs an
        authenticated Steam login and the node has no stored credentials.
        GET /servers/{id}/settings reports which way the next start will go.
        That pass is asynchronous: the
        response is then 202 with state `installing` (the console streams the
        install log), and the server continues to `running` on its own. Where a
        failed pass lands depends on the phase: a stop (or agent connection)
        that fails before the install restores the previous state with
        `last_error` set and no reinstall gate, a failed install script lands in
        `install_failed` and refuses start until a reinstall, and a failed start
        over a good install lands in `offline`. Stop/kill, and a start that
        skips the pass, still answer 200 with the new state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerRequest' }
      responses:
        '200':
          description: New lifecycle state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: '#/components/schemas/ServerState' }
        '202':
          description: Update pass started; the server is installing and will start when it finishes
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: '#/components/schemas/ServerState' }
                  updating: { type: boolean }
        '409':
          description: >
            Start or restart refused: the server is installing, its install
            failed (reinstall first), a backup restore is running (`code:
            server_restoring` — stop and kill still reach the agent, and the
            state stays `restoring` until the restore ends), the game spec it
            was built from no longer
            exists (`code: spec_missing`; permanent, since a spec's id cannot be
            recreated), or a setting its spec marks `required` is empty (`code:
            required_settings_missing`, with the keys in `missing_settings`).
            Nothing was attempted and the server's state is unchanged. Stop and
            kill are never refused for any of these. The node's agent can also
            refuse a start or restart while an install pass for the server is
            running on it (`code: install_running`); retry once it ends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartRefusal' }
        '500':
          description: >
            The server's spec could not be read (a store error, not a missing
            spec), so start and restart were refused rather than run unchecked
            and nothing was attempted — or the node reported a failure it did
            not classify (`code: node_error`), with its message in `error`.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '503':
          description: >
            `code: node_unreachable`. Either the panel has no live connection to
            the hosting node's agent — then nothing was attempted and the
            server's state is unchanged — or the agent did not answer within the
            time allowed, and the action may still be completing on the node (a
            stop still inside its graceful-stop window, say): `error` says which.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /servers/{id}/reinstall:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Servers]
      summary: Re-run the install script once, now
      description: >
        Both the retry for a failed install and the explicit "update now" for a
        server whose start does not update it (a pinned build, or a spec that
        opted out of update-on-start). Valid from the stopped states —
        install_failed, offline, crashed — and refused while the server is
        installing, starting, running or stopping. Runs asynchronously: the
        server flips to `installing` and the install log streams over the
        console socket.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                steam_guard_code:
                  type: string
                  description: One-time 2FA code for specs whose install needs an authenticated Steam login.
      responses:
        '202':
          description: Install started
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: '#/components/schemas/ServerState' }
        '409':
          description: The server is not in a stopped state
  /servers/{id}/install-log:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Servers]
      summary: Read the retained output of the server's most recent install
      description: >
        The install runs on the Agent and is streamed to the Panel, which buffers
        it in memory: there is no container left to tail once the phase ends. The
        buffer is kept after the install finishes — success included, since an
        installer can exit 0 having produced a broken tree — until the server is
        deleted or reinstalled. It does NOT survive a Panel restart; `retained`
        is false when nothing is held, which is not the same as an install that
        printed nothing.
      responses:
        '200':
          description: Buffered install output
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id: { type: string }
                  done: { type: boolean, description: the attempt reached a verdict }
                  retained: { type: boolean, description: this Panel process still holds a buffer }
                  started_ms: { type: integer, format: int64 }
                  finished_ms: { type: integer, format: int64 }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: integer, format: int64 }
                        stream: { type: string, description: '"install" or "error"' }
                        text: { type: string }

  /servers/{id}/settings:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Servers]
      summary: Get grouped game settings + current values
      responses:
        '200':
          description: Settings (groups + values), and what the next start does about updates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerSettings' }
    put:
      tags: [Servers]
      summary: Update game settings values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                variables:
                  type: object
                  additionalProperties: { type: string }
                pin_build:
                  type: boolean
                  description: >-
                    The server's build pin. Omit to leave it unchanged — an
                    ordinary settings save must not unpin a server.
      responses:
        '200': { description: Applied (with any validation errors) }
        '400':
          description: >
            The body is invalid, or a value is outside what the spec allows (a
            read-only setting, a variable that is not editable) — or the
            settings were saved and the node refused a config file's path as
            one that can never work (`code: bad_path`).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: >
            No such server — or the settings were saved and the node reported a
            config file's folder missing (`code: not_found`).
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '409':
          description: >
            The settings were saved, but the node refused the rendered config
            files: `code` is `file_in_use`, `node_refused` or `already_exists`,
            and `error` begins "settings saved but config apply failed:".
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '500':
          description: >
            The settings could not be saved — or they were saved and applying
            the config failed on the Panel (`code: config_apply_failed`, a
            render error) or on the node (`code: node_error`). When the save
            itself succeeded, `error` begins "settings saved but config apply
            failed:".
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '503':
          description: >
            The settings were saved, but applying them did not complete
            (`code: node_unreachable`): the node's agent could not be reached,
            or it did not answer within the time allowed — in which case the
            config may still have been written on the node.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /servers/{id}/files:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Files]
      summary: List files under a path
      parameters:
        - { name: path, in: query, schema: { type: string }, description: directory to list }
      responses:
        '200': { description: Directory listing }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/content:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Files]
      summary: Read a single file's contents
      parameters: [ { name: path, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: File content (capped) }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/raw:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Files]
      summary: Download a single file (raw bytes)
      description: >
        Streams the file. Authenticate either with the ordinary session bearer,
        or with a one-time `token` from /files/download-token — the token form
        is what lets a plain download link carry the authorization, so the
        browser streams to disk instead of buffering the payload in memory.
        When `token` is present the Authorization header is not consulted at
        all, and `path` must be exactly the path the token was minted for.


        The response carries `Content-Length` when the Agent announced the
        file's size (an older Agent does not, and then there is none), so a
        truncated transfer is detectable rather than arriving as a complete
        download. `Accept-Ranges: none` goes out either way: a download token
        is single-use, so a ranged second request could only be refused.
        Rate limited per source IP (30 a minute, burst 10).
      parameters:
        - name: path
          in: query
          required: false
          description: >
            The file to stream. Required on the session-authenticated form; on
            the token form it may be omitted, since the token already names the
            path — supplied, it must match that path exactly or the request is
            refused.
          schema: { type: string }
        - $ref: '#/components/parameters/DownloadToken'
      responses:
        '200': { description: Raw file stream }
        '400': { description: "No path was supplied on the session-authenticated form, or the path can never work — it escapes the server's data directory, or names a folder (`code: bad_path`)" }
        '401': { description: "Unknown, expired, already-used or wrong-server/wrong-path download token — or the session that minted it is gone" }
        '404': { description: "No such server, or one this user may not reach (existence is not revealed) — or no such file on the node (`code: not_found`); the body is a JSON error, never a file" }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '429': { description: "Too many token redemptions from this address; retry after the Retry-After header says" }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/download:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Files]
      summary: Download a token's path set as a zip
      description: >
        The GET twin of the zip route, for a plain download link. It carries no
        body: the paths come from the one-time `token`, which is also the only
        thing that authorizes it. Required — without a token there is nothing
        to stream.
      parameters:
        - name: token
          in: query
          required: true
          description: >
            A one-time download token from POST
            /servers/{id}/files/download-token. Required here: it is both the
            authorization and the only source of the paths.
          schema: { type: string }
      responses:
        '200': { description: Zip stream }
        '400': { description: No token was supplied }
        '401': { description: "Unknown, expired, already-used or wrong-server download token — or the session that minted it is gone" }
        '404': { description: "No such server, or one this user may not reach (existence is not revealed) — or a path that does not exist on the node (`code: not_found`); the body is a JSON error, never a file" }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '429': { description: "Too many token redemptions from this address; retry after the Retry-After header says" }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
    post:
      tags: [Files]
      summary: Download selected paths as a zip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths: { type: array, items: { type: string } }
      responses:
        '200': { description: Zip stream }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/download-token:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Mint a one-time download token
      description: >
        Issues an opaque token that authorizes exactly one download of exactly
        one path set on this one server, for 60 seconds, on behalf of the
        calling user. It is redeemed on GET /files/raw or GET /files/download
        and deleted on first use; the user's permission is re-checked at
        redemption, so a revoked role takes effect immediately, and so is the
        minting session, so logging out or having that session revoked kills
        any token it minted. The token is
        held in the Panel's memory only, never persisted, and never a session
        credential. Requires server.files.read — the same permission the raw
        route carries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `path` (raw route) or `paths` (zip route).
              properties:
                path:
                  type: string
                  description: One file, for a token redeemable on GET /files/raw.
                paths:
                  type: array
                  items: { type: string }
                  description: A path set, for a token redeemable on GET /files/download.
      responses:
        '201':
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: The tokenised URL to navigate to.
                  token: { type: string }
                  kind: { type: string, enum: [raw, zip] }
                  expires_at: { type: string, format: date-time }
                  expires_in_seconds: { type: integer }
        '400': { description: "No path, both shapes at once, or a path that escapes the tree" }
        '404': { description: "No such server, or one this user may not reach (existence is not revealed)" }
  /servers/{id}/files/mkdir:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Create a directory
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/move:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Move/rename a path
      responses:
        '200': { description: Moved }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/copy:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Copy a path
      responses:
        '200': { description: Copied }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/write:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Write/overwrite a file
      responses:
        '201': { description: Written }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/upload:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Upload files (multipart)
      description: >
        The request body is capped at 64 MiB plus a megabyte of multipart
        framing; anything larger is refused outright rather than spooled to the
        Panel's disk.
      responses:
        '201': { description: Uploaded }
        '400': { description: "The body is not a valid multipart form, names no files, or targets a path that can never work (`code: bad_path`)" }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '413': { description: The upload is larger than the Panel accepts }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/files/delete:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    post:
      tags: [Files]
      summary: Delete paths
      responses:
        '200': { description: Deleted }
        '400': { $ref: '#/components/responses/AgentBadPath' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }

  /servers/{id}/backups:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Backups]
      summary: List backups
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
    post:
      tags: [Backups]
      summary: Create a backup
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        '202':
          description: Archiving started; poll the list for the backup to reach ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /servers/{id}/backups/{backupId}/restore:
    parameters:
      - { $ref: '#/components/parameters/ServerId' }
      - { name: backupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Backups]
      summary: Restore a backup
      description: >
        Only valid while the server is stopped (state offline, crashed or
        install_failed). Runs asynchronously: the server enters `restoring` at
        once, and GET /servers/{id} carries a `restore` block with the phase and
        the compressed bytes read until the restore ends. Start and restart are
        refused while it runs (409 `server_restoring`). When it ends the server
        goes back to offline (install_failed if it came from there); a failed
        restore leaves its reason in `last_error`, including whether the files
        were rolled back.
      responses:
        '202':
          description: Restore started; the server is restoring
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '409':
          description: >
            The server is not stopped, or a restore is already running for it
            (`code: restore_in_progress`). Nothing was started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [restore_in_progress] }
        '503':
          description: >
            The panel has no live connection to the hosting node's agent. Nothing
            was attempted and the server's state is unchanged.
  /servers/{id}/backups/{backupId}:
    parameters:
      - { $ref: '#/components/parameters/ServerId' }
      - { name: backupId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Backups]
      summary: Delete a backup
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/AgentNotFound' }
        '409': { $ref: '#/components/responses/AgentConflict' }
        '500': { $ref: '#/components/responses/AgentError' }
        '503': { $ref: '#/components/responses/NodeUnreachable' }

  /servers/{id}/schedules:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [Schedules]
      summary: List a server's scheduled tasks
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduledTask' }
    post:
      tags: [Schedules]
      summary: Create a scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /servers/{id}/schedules/{scheduleId}:
    parameters:
      - { $ref: '#/components/parameters/ServerId' }
      - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Schedules]
      summary: Update a scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }
    delete: { tags: [Schedules], summary: Delete a scheduled task, responses: { '204': { description: Deleted } } }

  /specs:
    get:
      tags: [Specs]
      summary: List game specs
      responses:
        '200':
          description: Specs
          content:
            application/json:
              schema:
                type: object
                properties:
                  specs: { type: array, items: { $ref: '#/components/schemas/Spec' } }
    post:
      tags: [Specs]
      summary: Create a spec (accepts JSON or YAML body)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Spec' } }
          application/yaml: { schema: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json: { schema: { $ref: '#/components/schemas/Spec' } }
  /specs/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Specs]
      summary: Get a spec
      responses:
        '200':
          description: Spec
          content:
            application/json: { schema: { $ref: '#/components/schemas/Spec' } }
    put:
      tags: [Specs]
      summary: Update a spec (JSON or YAML)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Spec' } }
          application/yaml: { schema: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json: { schema: { $ref: '#/components/schemas/Spec' } }
    delete:
      tags: [Specs]
      summary: Delete a spec
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Refused while any server is built from the spec: a server keeps its
            spec's id for life, and could never start again without it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [spec_in_use] }
                  servers: { type: integer, description: how many servers use the spec }

  /nodes:
    get:
      tags: [Nodes]
      summary: List nodes
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/Node' } }
                  panel_version: { type: string, description: the Panel's own build — an agent_version that differs is version skew }
    post:
      tags: [Nodes]
      summary: Register a node
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/NodeRegister' } }
      responses:
        '201':
          description: Registered
          content:
            application/json: { schema: { $ref: '#/components/schemas/Node' } }
  /nodes/telemetry:
    get:
      tags: [Nodes]
      summary: Live host vitals for every node
      description: >-
        Cpu, memory, disk, network and temperature for each node, as sampled by
        its Agent and cached by the Panel (refreshed every 5s). Intended to be
        polled for the node instrument bands.


        A node appears only when the Panel holds a recent reading for it: nodes
        that are unreachable, or whose Agent predates the telemetry RPC, are
        absent from the map rather than present with zero values. Within a node,
        each metric group carries a *_known flag — false means the host could not
        supply that metric (a Windows host has no temperature source, for
        example) and the value must be rendered as "no data", never as 0.
      responses:
        '200':
          description: Telemetry keyed by node id
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: object
                    additionalProperties: { $ref: '#/components/schemas/NodeTelemetry' }
  /nodes/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Nodes]
      summary: Get a node
      responses:
        '200':
          description: Node
          content:
            application/json: { schema: { $ref: '#/components/schemas/Node' } }
    patch:
      tags: [Nodes]
      summary: Rename a node, or update its schedulable capacity (total memory, game-port range)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64, description: "Display name; servers reference a node by UUID, so renaming never disturbs what is running. Must not be blank." }
                total_memory_mb: { type: integer, description: Must cover memory already reserved by servers on the node }
                port_start: { type: integer, description: Set together with port_end; existing allocations are preserved }
                port_end: { type: integer }
      responses:
        '200':
          description: Updated node
          content:
            application/json: { schema: { $ref: '#/components/schemas/Node' } }
        '400': { description: Invalid capacity values }
    delete: { tags: [Nodes], summary: Deregister a node, responses: { '204': { description: Deleted } } }
  /nodes/{id}/agent-update:
    post:
      tags: [Nodes]
      summary: Push this Panel's embedded agent binary to the node (admin)
      description: >
        Streams the agent build embedded in this Panel (always the Panel's own
        version) to the node over the mTLS gRPC channel. The agent verifies the
        checksum, swaps its binary transactionally (keeping the previous build
        for automatic rollback), and restarts. Dev Panel builds embed no agent
        binaries and return 503. Containerized agents refuse the push — pull
        the new image instead.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Binary pushed; the agent is restarting into it
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_version: { type: string }
                  to_version: { type: string }
                  bytes: { type: integer }
                  restarting: { type: boolean }
        '409': { description: Agent already at the Panel's version }
        '503': { description: "Agent unreachable, or no embedded agent binary in this Panel build (reason verbatim)" }
  /nodes/{id}/info:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Nodes]
      summary: Live Agent info (pings the node over mTLS, brings it online)
      responses:
        '200': { description: Live node info }
        '503': { $ref: '#/components/responses/NodeUnreachable' }
  /nodes/{id}/servers/{serverID}/power:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: serverID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Nodes]
      summary: Power action sent straight to one node's agent
      description: >
        A lower-level power path than POST /servers/{id}/power: it forwards the
        action to the named node's agent and does not run the update pass,
        re-push the spec or render config. Start and restart are refused on the
        same grounds as the server-scoped endpoint, with the same bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerRequest' }
      responses:
        '200':
          description: The agent's reported state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, description: "the agent's enum name, e.g. SERVER_STATE_RUNNING" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Start or restart refused: the server is installing, its install
            failed, its spec no longer exists (`code: spec_missing`), or a
            required setting is empty (`code: required_settings_missing`, with
            the keys in `missing_settings`). Nothing was sent to the agent. Or
            the agent refused a start or restart because an install pass for the
            server is running on the node (`code: install_running`); retry once
            it ends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartRefusal' }
        '500':
          description: >
            The server's spec could not be read, so start and restart were
            refused — or the node reported a failure it did not classify
            (`code: node_error`), with its message in `error`.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '503':
          description: >
            The panel could not reach the node's agent, or the agent did not
            answer within the time allowed (`code: node_unreachable`). A timed-out
            stop or restart may still be completing on the node.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /nodes/{id}/containers/{serverID}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: serverID
        in: path
        required: true
        description: the server id from the container's `kraken.server_id` label, as listed in managed_containers
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$' }
    delete:
      tags: [Nodes]
      summary: Retire an untracked container (data untouched)
      description: >-
        Stops and removes the container a node runs for a server id the Panel
        has no server on that node for — an entry of managed_containers that no
        server row matches — and has the Agent forget its spec so its watchdog
        never adopts it again. The server's data directory and backups are left
        exactly where they are. Requires server.delete and node.manage.
      responses:
        '204': { description: Retired; the container is gone and the node's managed_containers no longer lists it }
        '400':
          description: "Malformed server id (code: invalid_server_id)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '403':
          description: "Missing server.delete or node.manage (code: forbidden)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '404':
          description: "Node not found (code: node_not_found)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '409':
          description: >-
            Refused, nothing sent to the node. `code: server_tracked` — the Panel
            tracks a server with this id on this node; delete the server instead.
            `code: removal_pending` — a removal is already owed for this id (it
            may delete the data), so a retire that promised the data stays would
            be undone by the next replay; let it finish, or dismiss it first.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '500':
          description: >-
            The node answered but could not remove the container, its reason
            verbatim — a container engine the Agent cannot reach included
            ("docker: cannot connect to the daemon: …") — `code: node_error`;
            or the Panel could not read its own records (`code: internal`).
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '503':
          description: >-
            `code: node_unreachable`. The node's Agent could not be reached —
            nothing was sent — or it did not answer within the time allowed, in
            which case the removal may still be completing on the node.
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
  /nodes/{id}/removals/{serverID}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: serverID
        in: path
        required: true
        description: the server_id of an entry in the node's pending_removals
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$' }
    delete:
      tags: [Nodes]
      summary: Dismiss a pending removal without delivering it
      description: >-
        Forgets a removal the node owes — for a node that is gone for good, or a
        container cleared by hand — and releases the memory and ports it was
        holding. Nothing is sent to the node: if the container is in fact still
        running, retire it or remove it on the host. Requires server.delete and
        node.manage.
      responses:
        '204': { description: Dismissed; the record is gone and its allocation released }
        '400':
          description: "Malformed server id (code: invalid_server_id)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '403':
          description: "Missing server.delete or node.manage (code: forbidden)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '404':
          description: "Node not found (code: node_not_found), or no removal is pending for this id (code: removal_not_found)"
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
        '500':
          description: "The Panel could not read or update the node record (code: internal). Nothing is sent to the node, so no Agent status applies."
          content:
            application/json: { schema: { $ref: '#/components/schemas/CodedError' } }
  /nodes/{id}/config:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Nodes]
      summary: Get a node's backup/credential config (stored secrets are never echoed)
      responses:
        '200':
          description: Node config
          content:
            application/json: { schema: { $ref: '#/components/schemas/NodeConfigView' } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Nodes]
      summary: Update a node's backup/credential config and push it to the Agent
      description: >
        Omitted fields keep their stored value; "" clears one. Saving pushes the
        config to an online Agent, which verifies the configured remote — the
        apply_* fields report that outcome, and a failure there is not a save
        failure.
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/NodeConfigUpdate' } }
      responses:
        '200':
          description: Saved config plus the Agent apply result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NodeConfigView'
                  - type: object
                    properties:
                      applied: { type: boolean, description: the config reached the Agent }
                      apply_ok: { type: boolean, description: the configured target(s) verified }
                      apply_detail: { type: string }
        '400': { description: "Unknown backup_target, an unrecognized path token, or both replication mirrors enabled" }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/bootstrap-tokens:
    post:
      tags: [Enrollment]
      summary: Issue a one-time Agent bootstrap token (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                node_name: { type: string, description: audit-log label only (default "remote-agent") — the node's real name comes from the agent at registration }
                ttl_seconds: { type: integer, description: token lifetime (default 900) }
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  node_name: { type: string }
                  expires_at: { type: string, format: date-time }
                  ca_fingerprint: { type: string, description: full SHA-256 fingerprint of the Panel CA — embed in the agent's install command as --ca-fingerprint to pin the enrollment }
        '503': { description: CA signing not configured }
  /agents/enroll-status:
    get:
      tags: [Enrollment]
      summary: Poll a bootstrap token's lifecycle (pending → redeemed)
      description: >
        Lets the setup wizard show live enrollment progress. Once redeemed, the
        response includes the enrolling source IP and the hosts the agent baked
        into its certificate (its reachable addresses) so node registration can
        be prefilled.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Token state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, redeemed, expired] }
                  node_name: { type: string }
                  ip: { type: string }
                  hosts: { type: array, items: { type: string }, description: "agent-advertised reachable addresses, IPs first" }
                  agent_port: { type: integer, description: agent-reported gRPC port for the registration prefill }
                  expires_at: { type: string, format: date-time }
                  redeemed_at: { type: string, format: date-time }
  /agents/enroll:
    post:
      tags: [Enrollment]
      summary: Enroll an Agent — exchange a bootstrap token + CSR for a signed cert
      description: >
        Authenticated solely by the one-time bootstrap token (the Agent has no
        session yet). Returns the signed Agent certificate and the CA cert.
        Re-enrolling with a fresh token rotates the certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, csr]
              properties:
                token: { type: string }
                csr: { type: string, description: PEM-encoded certificate signing request }
                agent_port: { type: integer, description: gRPC port the agent will serve on (default 9090) — used to prefill node registration }
      responses:
        '200':
          description: Signed certificate + CA (PEM)
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { type: string }
                  ca: { type: string }
        '401': { description: Invalid/expired bootstrap token }

  /users:
    get:
      tags: [Users & Roles]
      summary: List users
      responses: { '200': { description: Users } }
    post:
      tags: [Users & Roles]
      summary: Create a user
      responses: { '201': { description: Created } }
  /users/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    put: { tags: [Users & Roles], summary: Update a user, responses: { '200': { description: Updated } } }
    delete: { tags: [Users & Roles], summary: Delete a user, responses: { '204': { description: Deleted } } }
  /users/{id}/password:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
    post: { tags: [Users & Roles], summary: Reset a user's password, responses: { '200': { description: Reset } } }
  /roles:
    get: { tags: [Users & Roles], summary: List roles, responses: { '200': { description: Roles } } }
  /permissions:
    get: { tags: [Users & Roles], summary: List known permissions, responses: { '200': { description: Permissions } } }

  /settings:
    get:
      tags: [Settings]
      summary: Panel-global settings status (never returns secrets)
      responses:
        '200':
          description: Settings status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
    put:
      tags: [Settings]
      summary: Update Panel-global settings (Cloudflare token, UniFi gateway)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cloudflare_api_token: { type: string, description: "Scoped Cloudflare API token; empty string clears it" }
                unifi_url: { type: string, description: "UniFi controller base URL, e.g. https://192.168.1.1" }
                unifi_api_key: { type: string, description: "UniFi OS API key; empty string clears it" }
                unifi_site: { type: string, description: "UniFi site (default 'default')" }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
  /settings/cloudflare/test:
    post:
      tags: [Settings]
      summary: Verify the stored Cloudflare token by listing its zones
      responses:
        '200':
          description: Reachable zones
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones: { type: array, items: { type: string } }
        '400': { description: Cloudflare not configured }
        '502': { description: Cloudflare API error }
  /settings/unifi/test:
    post:
      tags: [Settings]
      summary: Verify the stored UniFi credentials (lists forwards + WAN IP)
      responses:
        '200':
          description: Reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  forward_count: { type: integer }
                  wan_ip: { type: string }
        '400': { description: UniFi not configured }
        '502': { description: UniFi API error }
  /servers/{id}/dns:
    parameters: [ { $ref: '#/components/parameters/ServerId' } ]
    get:
      tags: [DNS]
      summary: Current DNS assignment + target for a server
      responses:
        '200':
          description: DNS state
          content:
            application/json:
              schema:
                type: object
                properties:
                  cloudflare_configured: { type: boolean }
                  unifi_configured: { type: boolean }
                  target_host: { type: string, description: "external/WAN host for DNS + connect" }
                  lan_host: { type: string, description: "node LAN IP (port-forward target)" }
                  ports: { type: object, additionalProperties: { type: integer } }
                  dns: { $ref: '#/components/schemas/ServerDNS' }
                  forwards:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        rule_id: { type: string }
                        enabled: { type: boolean }
    put:
      tags: [DNS]
      summary: Assign a DNS name (creates A/CNAME + optional SRV in Cloudflare)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "FQDN, e.g. play.example.com" }
                service: { type: string, description: "SRV service label (e.g. minecraft); omit to skip SRV" }
                port_name: { type: string, description: "spec port to advertise; defaults to the primary port" }
      responses:
        '200':
          description: Records created
          content:
            application/json:
              schema:
                type: object
                properties:
                  dns: { $ref: '#/components/schemas/ServerDNS' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: Cloudflare API error }
        '503': { description: Cloudflare not configured }
    delete:
      tags: [DNS]
      summary: Remove a server's DNS records
      responses:
        '200': { description: Removed }
  /servers/{id}/forwards/{portName}:
    parameters:
      - { $ref: '#/components/parameters/ServerId' }
      - { name: portName, in: path, required: true, schema: { type: string } }
    post:
      tags: [DNS]
      summary: Open (create/enable) or close (disable) a UniFi port forward for a server port
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [open]
              properties:
                open: { type: boolean }
      responses:
        '200': { description: Forward updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: UniFi API error }
        '503': { description: UniFi not configured }
  /audit:
    get:
      tags: [Audit]
      summary: List recent audit entries (newest first)
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  retention_days: { type: integer, description: 'how many days of audit log the Panel keeps (KRAKEN_AUDIT_RETENTION_DAYS); 0 means entries are never pruned' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from POST /auth/login
  parameters:
    ServerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DownloadToken:
      name: token
      in: query
      required: false
      description: >
        A one-time download token from POST /servers/{id}/files/download-token.
        Single-use, 60 seconds, bound to one server, one exact path set and the
        user who minted it. Present, it is the whole authority for the request
        and no Authorization header is read; absent, the route authenticates as
        it always has.
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NotFound:
      description: Resource not found
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    # The answers to a failed Agent operation (#352). None is a 502 or 504:
    # an edge proxy such as Cloudflare replaces those bodies with its own page,
    # and the body here is the operator's diagnosis.
    AgentBadPath:
      description: >
        The path can never work: it escapes the server's data directory, or
        names the data root where a file or folder is required
        (`code: bad_path`).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    AgentNotFound:
      description: >
        No such server, or one this user may not reach (existence is not
        revealed) — or the path or backup does not exist on the node
        (`code: not_found`).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    AgentConflict:
      description: >
        The node refused the operation, and `code` says why: `file_in_use`
        (another process holds the file — usually the server's own game, still
        running), `node_refused` (the node's filesystem denied it) or
        `already_exists`. `error` carries the node's own words.
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    AgentError:
      description: >
        The node reported a failure it did not classify (`code: node_error`);
        `error` carries its message.
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NodeUnreachable:
      description: >
        The panel could not reach the node's agent, or it did not answer in
        time (`code: node_unreachable`).
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: The human-readable reason, as the UI shows it.
        code:
          type: string
          description: >
            A stable, machine-readable reason, present on the failures a
            client may want to branch on — branch on this, never on `error`.
            A failed Agent operation carries one of node_unreachable,
            not_found, bad_path, file_in_use, node_refused, already_exists,
            install_running or
            node_error; a settings save whose config could not be rendered
            carries config_apply_failed.
    CodedError:
      type: object
      properties:
        error: { type: string, description: "the reason, for a person" }
        code: { type: string, description: a stable identifier for a client to branch on }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role_id: { type: string }
        disabled: { type: boolean }
        must_change_password: { type: boolean }
    BootstrapToken:
      type: object
      properties:
        token: { type: string }
        node_name: { type: string }
        expires_at: { type: string, format: date-time }
    CatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon_url: { type: string }
        banner_url: { type: string }
        platforms: { type: array, items: { type: string } }
        already_imported: { type: boolean }
    ServerState:
      type: string
      enum: [installing, install_failed, offline, starting, running, stopping, crashed, restoring]
    RestoreProgress:
      type: object
      description: >
        A running backup restore. Progress is compressed bytes read from the
        archive against its size; bytes_total is 0 when the size is unknown (an
        agent too old to report progress, or a target that cannot size the
        archive), and a client must then show progress as unknown, not as zero.
      properties:
        backup_id: { type: string }
        phase: { type: string, enum: [opening, extracting, applying, done, restoring], description: "restoring = an old agent restoring without progress" }
        bytes_done: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
    Server:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        spec_id: { type: string, format: uuid }
        node_id: { type: string }
        kind: { type: string, enum: [linux-native, linux-wine, windows-native] }
        state: { $ref: '#/components/schemas/ServerState' }
        vars: { type: object, additionalProperties: { type: string } }
        settings: { type: object, additionalProperties: { type: string } }
        ports: { type: object, additionalProperties: { type: integer } }
        memory_mb: { type: integer }
        dns: { $ref: '#/components/schemas/ServerDNS' }
        bepinex: { type: boolean, description: deployed with BepInEx mod support }
        pin_build:
          type: boolean
          description: >-
            Pinned to the build on disk — the panel skips the install/update
            pass it otherwise runs before every start or restart.
        last_error: { type: string, description: "why the most recent provisioning attempt, or backup restore, failed" }
        restore:
          allOf: [ { $ref: '#/components/schemas/RestoreProgress' } ]
          description: Present only while a backup restore is running (state `restoring`).
        provisioned_at:
          type: string
          format: date-time
          description: >-
            When the most recent create or reinstall install pass completed. A
            start within 30 minutes of it skips the update pass, which would
            only repeat an install that just ran.
        created_at: { type: string, format: date-time }
    ServerDNS:
      type: object
      nullable: true
      properties:
        name: { type: string }
        zone_id: { type: string }
        service: { type: string }
        port_name: { type: string }
        record_ids: { type: array, items: { type: string } }
    SettingsView:
      type: object
      properties:
        cloudflare_configured: { type: boolean }
        unifi_configured: { type: boolean }
        unifi_url: { type: string }
        unifi_site: { type: string }
    DBConnectRequest:
      type: object
      required: [host, user]
      properties:
        host: { type: string }
        port: { type: integer, default: 5432 }
        user: { type: string }
        password: { type: string, format: password }
        dbname: { type: string, default: kraken }
        sslmode: { type: string, default: disable }
    PowerRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, stop, restart, kill] }
    Spec:
      type: object
      description: Game specification (the "egg" equivalent). Large; key fields shown.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        version: { type: integer }
        platforms:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              image: { type: string }
        startup:
          type: object
          properties:
            command: { type: string }
            ready_regex: { type: string }
            stop:
              type: object
              properties:
                type: { type: string, enum: [signal, command] }
                value: { type: string }
            restart:
              type: object
              properties:
                on_crash: { type: boolean }
                max_retries: { type: integer }
        ports:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              protocol: { type: string, enum: [tcp, udp] }
              default: { type: integer }
              required: { type: boolean }
        backup:
          type: object
          description: >-
            What a backup of this game captures — a backup is the SAVE DATA, not
            the reinstallable install tree. Patterns are doublestar globs (`**`
            spans any number of path segments) matched against data-dir-relative
            POSIX paths ("savegame/world.db"). include selects (omit for
            everything); exclude then filters, so an exclude wins on a conflict.
            Omit the whole block and the Panel applies its built-in policy: the
            whole data dir minus an ephemeral-only exclude list. Rejected at save
            time if a pattern does not compile.
          properties:
            include:
              type: array
              items: { type: string }
            exclude:
              type: array
              items: { type: string }
    Node:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        os: { type: string, enum: [linux, windows] }
        wine_enabled: { type: boolean }
        status:
          type: string
          enum: [online, partial, offline, cordoned]
          description: >-
            online = ready for work; partial = the Agent answers but cannot reach
            its container runtime (see runtime_error) and is not schedulable;
            offline = the Agent is unreachable; cordoned = reachable but excluded
            from new placements.
        runtime_error: { type: string, description: why the container runtime is unreachable (set while status is partial) }
        agent_version: { type: string, description: Agent build seen on last contact; compare with panel_version on the list response }
        running_servers:
          type: integer
          description: >-
            The AGENT's own count of the `kraken.managed` containers it had
            running on last contact. Compared against the server rows the Panel
            placed on this node it is what surfaces a container the Panel has
            lost track of; it is not derived from those rows.
        managed_containers:
          type: array
          description: >-
            The same containers running_servers counts, named — one entry per
            `kraken.managed` container the Agent reported running. Absent from
            an Agent older than 0.54.0, which reports only the count, so a
            client must fall back to running_servers rather than treat an empty
            list as "nothing running".
          items:
            type: object
            properties:
              server_id: { type: string, description: from the container's own `kraken.server_id` label; what the Panel matches against its rows }
              container_name: { type: string, description: the container's name on the host (e.g. `kraken_<server-id>`) }
        pending_removals:
          type: array
          description: >-
            Server removals owed to this node: servers deleted in the Panel whose
            removal the node never confirmed, because it was unreachable or its
            Agent reported a failure. The Panel's node reconciler replays each one
            with the recorded delete_data intent, with backoff, while the node answers, and
            drops it once the Agent confirms — releasing the memory and ports it
            held. Absent when nothing is owed.
          items:
            type: object
            properties:
              server_id: { type: string }
              delete_data: { type: boolean, description: whether the operator's delete also removes the world and config }
              requested_at: { type: string, format: date-time }
              attempts: { type: integer, description: "failed tries so far, the one made at delete time included" }
              last_error: { type: string, description: "the most recent failure, verbatim" }
              next_attempt:
                type: string
                format: date-time
                description: when the reconciler may try again — 20s after the first failure, doubling after each, an hour apart at most
              memory_mb: { type: integer, description: "the deleted server's memory, still allocated on this node until the removal lands" }
              ports: { type: array, items: { type: integer }, description: "the deleted server's host ports, still allocated on this node until the removal lands" }
        address: { type: string }
        public_host: { type: string }
        external_ip: { type: string }
        total_memory_mb: { type: integer }
        allocated_memory_mb: { type: integer }
    NodeTelemetry:
      type: object
      description: >-
        One node's host vitals. Rate metrics (cpu, network) are measured by the
        Agent over its own fixed sampling interval, so they do not skew with how
        often this endpoint is polled.
      properties:
        ts_unix_ms: { type: integer, format: int64, description: when the Agent sampled this reading }
        uptime_seconds: { type: integer, format: int64 }
        cpu_percent: { type: number, format: double, description: 0-100 across all cores; meaningful only when cpu_known }
        cpu_cores: { type: integer }
        cpu_known: { type: boolean, description: "false until the Agent has taken two samples, or when /proc is unreadable" }
        mem_total_mb: { type: integer, format: int64 }
        mem_used_mb: { type: integer, format: int64, description: "physical memory in use — total minus available, so reclaimable cache does not count as used" }
        mem_known: { type: boolean }
        disk_path: { type: string, description: the filesystem measured — the one holding the Agent's data dir }
        disk_total_mb: { type: integer, format: int64 }
        disk_used_mb: { type: integer, format: int64 }
        disk_known: { type: boolean }
        net_rx_bps: { type: number, format: double, description: bytes per second across the host's physical interfaces }
        net_tx_bps: { type: number, format: double }
        net_known: { type: boolean }
        link_rtt_ms: { type: number, format: double, description: "the Panel's own timing of the gRPC round trip that fetched this reading — no *_known flag, because the entry existing is the proof of the round trip" }
    NodeRegister:
      type: object
      required: [address]
      properties:
        name: { type: string, description: blank = adopt the agent's self-reported node id (KRAKEN_NODE_ID) }
        os: { type: string, enum: [linux, windows], description: blank = adopt the agent's self-reported OS }
        wine_enabled: { type: boolean, description: "ignored — derived from os (Wine ships in the game image, so every Linux node supports linux-wine)" }
        address: { type: string, description: "Agent gRPC host:port" }
        public_host: { type: string }
        total_memory_mb: { type: integer }
        port_start: { type: integer }
        port_end: { type: integer }
    NodeConfigView:
      type: object
      description: >-
        Where a node stores backups, plus the credentials the Panel injects into
        installs. Secrets are write-only: a stored one surfaces as a
        *_configured flag, never as its value.
      properties:
        backup_target: { type: string, enum: [local, share, sftp, smb], description: "share = a network share mounted on the host; smb = an SMB server the Agent dials itself with the credentials below (no host mount, so it works from a service account)" }
        backup_dir: { type: string, description: "node-local (or mounted-share) archive directory; supports {{SLUG}}" }
        sftp_host: { type: string, description: "host:port (default port 22)" }
        sftp_user: { type: string }
        sftp_password_configured: { type: boolean }
        sftp_key_configured: { type: boolean }
        sftp_base_path: { type: string, description: "remote archive directory; supports {{SLUG}}" }
        sftp_known_host_key: { type: string, description: pinned SSH host key in authorized_keys format; blank = trust-on-use }
        replicate_to_sftp: { type: boolean }
        smb_host: { type: string, description: "host[:port] (default port 445)" }
        smb_share: { type: string, description: "share name only, e.g. games" }
        smb_user: { type: string }
        smb_password_configured: { type: boolean }
        smb_domain: { type: string, description: optional NTLM domain; blank for a NAS or standalone server }
        smb_base_path: { type: string, description: "directory inside the share, share-relative; supports {{SLUG}}" }
        replicate_to_smb: { type: boolean, description: mutually exclusive with replicate_to_sftp }
        steam_username: { type: string }
        steam_configured: { type: boolean }
    NodeConfigUpdate:
      type: object
      description: Writable node config. Omit a field to leave it unchanged, send "" to clear it.
      properties:
        backup_target: { type: string, enum: ['', local, share, sftp, smb] }
        backup_dir: { type: string }
        sftp_host: { type: string }
        sftp_user: { type: string }
        sftp_password: { type: string, format: password }
        sftp_private_key: { type: string, format: password, description: "full PEM, newlines included" }
        sftp_base_path: { type: string }
        sftp_known_host_key: { type: string }
        replicate_to_sftp: { type: boolean }
        smb_host: { type: string }
        smb_share: { type: string }
        smb_user: { type: string }
        smb_password: { type: string, format: password }
        smb_domain: { type: string }
        smb_base_path: { type: string }
        replicate_to_smb: { type: boolean }
        steam_username: { type: string }
        steam_password: { type: string, format: password }
    Backup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer }
        created_ms: { type: integer, format: int64 }
        state: { type: string, enum: [pending, ready, failed], description: archive lifecycle — backups run asynchronously }
        replication: { type: string, enum: ['', pending, done, failed], description: off-node (SFTP) mirror status; empty when replication isn't configured }
        error: { type: string, description: "why the backup failed (state=failed), or a degraded-capture note on a ready archive; omitted when clean" }
    StartRefusal:
      type: object
      properties:
        error: { type: string, description: the sentence to show the operator }
        code: { type: string, enum: [required_settings_missing, spec_missing, install_running, server_restoring], description: "absent for the install-state refusals; install_running when the node's agent refused because an install pass is running there; server_restoring while a backup restore holds the server" }
        missing_settings: { type: array, items: { type: string }, description: "required_settings_missing only: the empty fields' keys" }
    ServerSettings:
      type: object
      properties:
        groups: { type: array, items: { type: object }, description: "the spec's grouped settings schema" }
        values: { type: object, additionalProperties: { type: string }, description: "this server's effective values, spec defaults filled in" }
        variables: { type: array, items: { type: object }, description: "the spec's launch variables with this server's values" }
        hot_reload: { type: boolean }
        pin_build: { type: boolean }
        updates_on_start:
          type: boolean
          description: >-
            False when the spec opted out of update-on-start (per spec or per
            platform), so the build pin is moot. About the spec, not the next
            start — see next_start_updates.
        next_start_updates:
          type: boolean
          description: >-
            Whether the next operator start or restart through the panel would
            run the update pass right now. Scheduled restarts and the
            node-scoped power endpoint never run it, and it means nothing while
            the server is installing or install_failed, where a start is refused.
        update_skip_reason:
          type: string
          enum: [spec, pinned, fresh_install, steam_login]
          description: >-
            Why next_start_updates is false; absent when it is true.
    ScheduleInput:
      type: object
      required: [action, cron]
      properties:
        name: { type: string }
        action: { type: string, enum: [restart, backup, command, replicate], description: "what the task does on each run; `restart` runs only on a server that is running, starting or crashed (it is skipped on offline, stopping, installing and install_failed, and while a required setting is empty or the spec is gone), never runs the update pass, and records any skip in last_error; `replicate` mirrors the server's existing backups to the node's configured off-node target (SFTP or SMB)" }
        cron: { type: string, description: "5-field cron expression (min hour dom month dow)" }
        command: { type: string, description: "required when action=command" }
        enabled: { type: boolean }
    ScheduledTask:
      allOf:
        - $ref: '#/components/schemas/ScheduleInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            server_id: { type: string, format: uuid }
            last_run_at: { type: string, format: date-time }
            next_run_at: { type: string, format: date-time }
            last_error: { type: string }
            created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        actor: { type: string }
        actor_id: { type: string }
        action: { type: string }
        method: { type: string }
        path: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        status: { type: integer }
        ip: { type: string }
        forwarded_for:
          type: string
          description: >-
            The raw X-Forwarded-For chain as received. Present only when `ip`
            cannot identify anybody — a NAT gateway standing in for every
            caller, or an address exempted with KRAKEN_RATE_LIMIT_IP_SKIP.
            Written by the caller and therefore untrusted: forensics, never an
            input to a decision.
