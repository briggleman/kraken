name: Enshrouded
slug: enshrouded
description: >-
  Enshrouded dedicated server (SteamCMD app 2278520). The server ships as a
  Windows build; it runs on a Windows node (steam-win image) or on a Linux node
  via Wine (steam-wine image, live-validated to Host_Online under Wine 10). All
  configuration lives in enshrouded_server.json, generated from the Settings
  tab. Joining is gated by per-role passwords (Admin/Friend/Guest/Visitor) —
  the password a player enters selects their role. Enshrouded is memory-hungry —
  16 GB is recommended for a full 16-slot group.
banner_url: https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1203620/18580ba964928c55f96c4d46809d4fa3aa7698d1/library_hero_2x.jpg?t=1782800102
icon_url: https://shared.fastly.steamstatic.com/community_assets/images/apps/1203620/b51ff4aa19722a1f3587b35f37f590a998f36a9a.jpg
steam_app_ids:
  windows: 2278520
platforms:
  - { kind: windows-native, image: ghcr.io/briggleman/kraken-steam-win:ltsc2022 }
  # linux-wine: same Windows depot, pulled by the LINUX SteamCMD with the forced
  # platform type, launched through Wine under headless X. Live-validated to the
  # Host_Online ready line under Wine 10 (issue #99). The server reads
  # enshrouded_server.json from its working directory (/data), which the config
  # file below writes via the logical /data root.
  - kind: linux-wine
    image: ghcr.io/briggleman/kraken-steam-wine:latest
    install_script: |-
      steamcmd +@sSteamCmdForcePlatformType windows +force_install_dir /data +login anonymous +app_update {{APP_ID}} {{VALIDATE}} +quit
      steamcmd +@sSteamCmdForcePlatformType windows +force_install_dir /data +login anonymous +app_update {{APP_ID}} {{VALIDATE}} +quit
    startup_command: wine-headless /data/enshrouded_server.exe
install:
  # Run app_update twice: SteamCMD can report "Missing configuration" on the
  # first pass against a fresh appinfo cache; the second pass downloads.
  # {{VALIDATE}} is `validate` on a create, revive or reinstall and nothing on
  # the update-on-start pass, which needs only the new build's changed chunks
  # (bundled/SPECS.md). The platform scripts above follow the same rule.
  script: >-
    steamcmd.exe +force_install_dir C:\data +login anonymous +app_update {{APP_ID}} {{VALIDATE}} +quit
    & steamcmd.exe +force_install_dir C:\data +login anonymous +app_update {{APP_ID}} {{VALIDATE}} +quit
startup:
  # Run from the data dir so the server finds enshrouded_server.json beside it.
  command: C:\data\enshrouded_server.exe
  # The server prints the Host_Online state once it is up and joinable.
  ready_regex: 'Host_Online'
  restart: { on_crash: true, max_retries: 3 }
  stop: { type: signal, value: CTRL_SHUTDOWN_EVENT }
# Current Enshrouded uses a SINGLE UDP port — the json calls it "queryPort" but
# it is the port players join on (the separate gamePort was removed from the
# server; see the official Dedicated Server Configuration article). Servers
# deployed under the old two-port spec keep their extra allocation; the
# template only reads .ports.game.
ports:
  - { name: game, protocol: udp, default: 15637, required: true }
# The roster comes from the server log, which names each player — A2S would
# give a count only. (The game port does answer A2S_INFO: verified directly on
# 2026-10-12, despite what this comment used to say.) Lines observed live
# 2026-09-14:
#   [server] Player 'GHETTO.CHiLD' logged in with Permissions: …
#   [server] Remove Entity for Player 'GHETTO.CHiLD'
# The name is the only identity the log gives, so it is the key. The cap is
# whatever the operator set slotCount to, not a constant. Double-quoted YAML
# here because the lines carry single quotes; that is why every \ is doubled.
query:
  method: log
  join_regex: "\\[server\\] Player '(?P<name>[^']+)' logged in with Permissions"
  leave_regex: "\\[server\\] Remove Entity for Player '(?P<name>[^']+)'"
  max_players_setting: slotCount
  max_players: 16

# The gameplay groups follow the config's own sections (player stats, combat,
# resources, day/night, survival, progression, other), ranges from the official
# Dedicated Server Configuration article. The custom gameSettings block is only
# APPLIED by the game when gameSettingsPreset == "Custom". Any other preset
# (Default/Relaxed/Hard/Survival) silently loads a bundled preset and ignores
# these values — so the gameplay groups nest under World settings with
# enabled_when on the preset, and the Settings tab shows them locked until it
# is Custom. Their values are still stored and rendered either way.
settings:
  groups:
    - id: server
      label: Server settings
      fields:
        - { key: name, label: Server name, type: string, default: "Kraken Enshrouded", help: "Shown in the server browser." }
        - { key: slotCount, label: Player slots, type: int, default: "16", min: 1, max: 16, help: "Every extra player adds CPU and memory load; matching this to the group you actually have keeps a small node responsive." }
        - { key: enableTextChat, label: Text chat, type: bool, default: "true" }
        - { key: enableVoiceChat, label: Voice chat, type: bool, default: "true" }
        - { key: voiceChatMode, label: Voice chat mode, type: enum, options: [Proximity, Global], default: Proximity }
    - id: world
      label: World settings
      description: >-
        Default, Relaxed, Hard and Survival use the game's own fixed values.
        Pick Custom to edit the sections below.
      fields:
        - { key: gameSettingsPreset, label: Preset, type: enum, options: [Default, Relaxed, Hard, Survival, Custom], default: Default }
    - id: player
      label: Player stats
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: playerHealthFactor, label: Player health, type: float, default: "1", min: 0.25, max: 4 }
        - { key: playerManaFactor, label: Player mana, type: float, default: "1", min: 0.25, max: 4 }
        - { key: playerStaminaFactor, label: Player stamina, type: float, default: "1", min: 0.25, max: 4 }
        - { key: playerBodyHeatFactor, label: Body heat, type: float, default: "1", min: 0.5, max: 2, help: "Cold resistance; higher loses heat more slowly." }
        - { key: playerDivingTimeFactor, label: Diving time, type: float, default: "1", min: 0.5, max: 2, help: "How long a player can stay under water." }
    - id: enemies
      label: Combat and enemies
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: enemyDamageFactor, label: Enemy damage, type: float, default: "1", min: 0.25, max: 5, help: "Bosses excluded; see Boss damage." }
        - { key: enemyHealthFactor, label: Enemy health, type: float, default: "1", min: 0.25, max: 4, help: "Bosses excluded; see Boss health." }
        - { key: enemyStaminaFactor, label: Enemy stamina, type: float, default: "1", min: 0.5, max: 2, help: "How hard enemies are to stun." }
        - { key: enemyPerceptionRangeFactor, label: Enemy perception range, type: float, default: "1", min: 0.5, max: 2, help: "How far away enemies notice you." }
        - { key: threatBonus, label: Threat bonus, type: float, default: "1", min: 0.25, max: 4, help: "How often enemies attack." }
        - { key: randomSpawnerAmount, label: Enemy spawns, type: enum, options: [Few, Normal, Many, Extreme], default: Normal }
        - { key: aggroPoolAmount, label: Enemies attacking at once, type: enum, options: [Few, Normal, Many, Extreme], default: Normal }
        - { key: bossDamageFactor, label: Boss damage, type: float, default: "1", min: 0.2, max: 5 }
        - { key: bossHealthFactor, label: Boss health, type: float, default: "1", min: 0.2, max: 5 }
        - { key: pacifyAllEnemies, label: Pacify all enemies, type: bool, default: "false", help: "Enemies never attack. Bosses still do." }
    - id: resources
      label: Resources and crafting
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: miningDamageFactor, label: Mining yield, type: float, default: "1", min: 0.5, max: 2, help: "Resources gained per mining hit." }
        - { key: plantGrowthSpeedFactor, label: Plant growth speed, type: float, default: "1", min: 0.25, max: 2 }
        - { key: resourceDropStackAmountFactor, label: Resource drop stacks, type: float, default: "1", min: 0.25, max: 2 }
        - { key: factoryProductionSpeedFactor, label: Crafting station speed, type: float, default: "1", min: 0.25, max: 2 }
        - { key: perkUpgradeRecyclingFactor, label: Rune recycling yield, type: float, default: "0.5", min: 0, max: 1, help: "Runes returned when recycling an upgraded weapon." }
        - { key: perkCostFactor, label: Rune upgrade cost, type: float, default: "1", min: 0.25, max: 2 }
    # The game stores these in nanoseconds; the template appends the nine zeros.
    - id: time
      label: Day / night cycle
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      description: >-
        In seconds: 1800 is 30 minutes. The default is a 30-minute day and a
        12-minute night.
      fields:
        - { key: dayTimeDurationSeconds, label: Day length (seconds), type: int, default: "1800", min: 120, max: 3600 }
        - { key: nightTimeDurationSeconds, label: Night length (seconds), type: int, default: "720", min: 120, max: 3600 }
    - id: survival
      label: Survival and environment
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: enableDurability, label: Item durability, type: bool, default: "true", help: "Whether equipment wears out and breaks." }
        - { key: enableStarvingDebuff, label: Starving debuff, type: bool, default: "false", help: "Health penalty for not eating." }
        - { key: foodBuffDurationFactor, label: Food buff duration, type: float, default: "1", min: 0.5, max: 2 }
        - { key: fromHungerToStarvingSeconds, label: Hunger → starving (seconds), type: int, default: "600", min: 300, max: 1200, help: "Time before starvation sets in, once Starving debuff is on." }
        - { key: shroudTimeFactor, label: Shroud tolerance, type: float, default: "1", min: 0.5, max: 2, help: "How long a player survives inside the Shroud." }
        - { key: tombstoneMode, label: Tombstone mode, type: enum, options: [AddBackpackMaterials, Everything, NoTombstone], default: AddBackpackMaterials, help: "What drops on death: backpack materials only, the whole inventory, or nothing." }
        - { key: enableGliderTurbulences, label: Glider turbulence, type: bool, default: "true" }
        - { key: weatherFrequency, label: Weather frequency, type: enum, options: [Disabled, Rare, Normal, Often], default: Normal }
    - id: progression
      label: Progression
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: experienceCombatFactor, label: Combat XP, type: float, default: "1", min: 0.25, max: 2 }
        - { key: experienceMiningFactor, label: Mining XP, type: float, default: "1", min: 0, max: 2 }
        - { key: experienceExplorationQuestsFactor, label: Exploration / quest XP, type: float, default: "1", min: 0.25, max: 2 }
    - id: other
      label: Other settings
      parent: world
      enabled_when: { setting: gameSettingsPreset, in: [Custom] }
      fields:
        - { key: tamingStartleRepercussion, label: Taming startle penalty, type: enum, options: [KeepProgress, LoseSomeProgress, LoseAllProgress], default: LoseSomeProgress, help: "Taming progress lost when the animal is startled." }
        - { key: curseModifier, label: Curse difficulty, type: enum, options: [Easy, Normal, Hard], default: Normal }
        - { key: fishingDifficulty, label: Fishing difficulty, type: enum, options: [VeryEasy, Easy, Normal, Hard, VeryHard], default: Normal }

# Enshrouded has no single server password: the password a player enters when
# joining selects their user group, and the group's flags are what that player
# may do. The four built-in roles carry the game's own default flags; the two
# custom slots exist because the schema has no add-a-row field type, so a group
# beyond the four needs a slot of its own. Give every group a DIFFERENT
# password — the password is how the server tells the groups apart.
    - id: players
      label: Player groups
      description: >-
        A player's join password picks their group. Use a different password
        for each group; a blank password turns the group off.
      fields: []
    - id: group-admin
      label: Admin
      parent: players
      description: >-
        Full control, including kick and ban.
      fields:
        - { key: adminName, label: Group name, type: string, default: "Admin", required: true }
        - { key: adminPassword, label: Password, type: password, default: "" }
        - { key: adminCanKickBan, label: Kick and ban players, type: bool, default: "true" }
        - { key: adminCanAccessInventories, label: Open chests and storage, type: bool, default: "true" }
        - { key: adminCanEditWorld, label: Edit the world, type: bool, default: "true" }
        - { key: adminCanEditBase, label: Build in bases, type: bool, default: "true" }
        - { key: adminCanExtendBase, label: Extend bases, type: bool, default: "true" }
        - { key: adminReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }
    - id: group-friend
      label: Friend
      parent: players
      description: >-
        Chests and building; no base extension.
      fields:
        - { key: friendName, label: Group name, type: string, default: "Friend", required: true }
        - { key: friendPassword, label: Password, type: password, default: "" }
        - { key: friendCanKickBan, label: Kick and ban players, type: bool, default: "false" }
        - { key: friendCanAccessInventories, label: Open chests and storage, type: bool, default: "true" }
        - { key: friendCanEditWorld, label: Edit the world, type: bool, default: "true" }
        - { key: friendCanEditBase, label: Build in bases, type: bool, default: "true" }
        - { key: friendCanExtendBase, label: Extend bases, type: bool, default: "false" }
        - { key: friendReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }
    - id: group-guest
      label: Guest
      parent: players
      description: >-
        Explore and fight; no chests or building.
      fields:
        - { key: guestName, label: Group name, type: string, default: "Guest", required: true }
        - { key: guestPassword, label: Password, type: password, default: "" }
        - { key: guestCanKickBan, label: Kick and ban players, type: bool, default: "false" }
        - { key: guestCanAccessInventories, label: Open chests and storage, type: bool, default: "false" }
        - { key: guestCanEditWorld, label: Edit the world, type: bool, default: "true" }
        - { key: guestCanEditBase, label: Build in bases, type: bool, default: "false" }
        - { key: guestCanExtendBase, label: Extend bases, type: bool, default: "false" }
        - { key: guestReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }
    - id: group-visitor
      label: Visitor
      parent: players
      description: >-
        Look around only.
      fields:
        - { key: visitorName, label: Group name, type: string, default: "Visitor", required: true }
        - { key: visitorPassword, label: Password, type: password, default: "" }
        - { key: visitorCanKickBan, label: Kick and ban players, type: bool, default: "false" }
        - { key: visitorCanAccessInventories, label: Open chests and storage, type: bool, default: "false" }
        - { key: visitorCanEditWorld, label: Edit the world, type: bool, default: "false" }
        - { key: visitorCanEditBase, label: Build in bases, type: bool, default: "false" }
        - { key: visitorCanExtendBase, label: Extend bases, type: bool, default: "false" }
        - { key: visitorReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }
    - id: group-custom1
      label: Custom group 1
      parent: players
      description: >-
        An extra tier of your own.
      fields:
        - { key: custom1Name, label: Group name, type: string, default: "Custom 1", required: true }
        - { key: custom1Password, label: Password, type: password, default: "" }
        - { key: custom1CanKickBan, label: Kick and ban players, type: bool, default: "false" }
        - { key: custom1CanAccessInventories, label: Open chests and storage, type: bool, default: "false" }
        - { key: custom1CanEditWorld, label: Edit the world, type: bool, default: "false" }
        - { key: custom1CanEditBase, label: Build in bases, type: bool, default: "false" }
        - { key: custom1CanExtendBase, label: Extend bases, type: bool, default: "false" }
        - { key: custom1ReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }
    - id: group-custom2
      label: Custom group 2
      parent: players
      description: >-
        A second extra tier.
      fields:
        - { key: custom2Name, label: Group name, type: string, default: "Custom 2", required: true }
        - { key: custom2Password, label: Password, type: password, default: "" }
        - { key: custom2CanKickBan, label: Kick and ban players, type: bool, default: "false" }
        - { key: custom2CanAccessInventories, label: Open chests and storage, type: bool, default: "false" }
        - { key: custom2CanEditWorld, label: Edit the world, type: bool, default: "false" }
        - { key: custom2CanEditBase, label: Build in bases, type: bool, default: "false" }
        - { key: custom2CanExtendBase, label: Extend bases, type: bool, default: "false" }
        - { key: custom2ReservedSlots, label: Reserved slots, type: int, default: "0", min: 0, max: 16, help: "Player slots held back for this group, so its members can join a full server." }

# The document mirrors the official 0.9.0.0 default enshrouded_server.json.
# The legacy top-level "password" is GONE — current server builds ignore it,
# which read as "the password doesn't work"; access is per-group userGroups,
# rendered below only for groups whose password is set. Free-text values (the
# server name, group names, passwords) go through printf "%q", which emits a
# quoted, escaped string: a raw " or \ in one used to produce invalid JSON, and
# the game answers invalid JSON by silently regenerating the file with
# defaults. Note: settings saves overwrite this file, so hand-edits (including
# bans added while it ran) will not persist — the "bans" list resets to empty
# on every save.
  # Logical /data root (not C:\data): safePath maps it to C:\data on a Windows
  # node and leaves it at /data on a Linux/Wine node, so one path is correct on
  # both — a literal C:\… path would land under /data/C:/… on Linux.
config_files:
  - path: /data/enshrouded_server.json
    format: template
    template: |
      {
        "name": {{printf "%q" .settings.name}},
        "saveDirectory": "./savegame",
        "logDirectory": "./logs",
        "ip": "0.0.0.0",
        "queryPort": {{.ports.game}},
        "slotCount": {{.settings.slotCount}},
        "tags": [],
        "enableTextChat": {{.settings.enableTextChat}},
        "enableVoiceChat": {{.settings.enableVoiceChat}},
        "voiceChatMode": "{{.settings.voiceChatMode}}",
        "gameSettingsPreset": "{{.settings.gameSettingsPreset}}",
        "gameSettings": {
          "playerHealthFactor": {{.settings.playerHealthFactor}},
          "playerManaFactor": {{.settings.playerManaFactor}},
          "playerStaminaFactor": {{.settings.playerStaminaFactor}},
          "playerBodyHeatFactor": {{.settings.playerBodyHeatFactor}},
          "playerDivingTimeFactor": {{.settings.playerDivingTimeFactor}},
          "foodBuffDurationFactor": {{.settings.foodBuffDurationFactor}},
          "shroudTimeFactor": {{.settings.shroudTimeFactor}},
          "enableDurability": {{.settings.enableDurability}},
          "enableStarvingDebuff": {{.settings.enableStarvingDebuff}},
          "enableGliderTurbulences": {{.settings.enableGliderTurbulences}},
          "enemyDamageFactor": {{.settings.enemyDamageFactor}},
          "enemyHealthFactor": {{.settings.enemyHealthFactor}},
          "enemyStaminaFactor": {{.settings.enemyStaminaFactor}},
          "enemyPerceptionRangeFactor": {{.settings.enemyPerceptionRangeFactor}},
          "threatBonus": {{.settings.threatBonus}},
          "bossDamageFactor": {{.settings.bossDamageFactor}},
          "bossHealthFactor": {{.settings.bossHealthFactor}},
          "randomSpawnerAmount": "{{.settings.randomSpawnerAmount}}",
          "aggroPoolAmount": "{{.settings.aggroPoolAmount}}",
          "pacifyAllEnemies": {{.settings.pacifyAllEnemies}},
          "weatherFrequency": "{{.settings.weatherFrequency}}",
          "fishingDifficulty": "{{.settings.fishingDifficulty}}",
          "curseModifier": "{{.settings.curseModifier}}",
          "tombstoneMode": "{{.settings.tombstoneMode}}",
          "tamingStartleRepercussion": "{{.settings.tamingStartleRepercussion}}",
          "miningDamageFactor": {{.settings.miningDamageFactor}},
          "plantGrowthSpeedFactor": {{.settings.plantGrowthSpeedFactor}},
          "resourceDropStackAmountFactor": {{.settings.resourceDropStackAmountFactor}},
          "factoryProductionSpeedFactor": {{.settings.factoryProductionSpeedFactor}},
          "dayTimeDuration": {{.settings.dayTimeDurationSeconds}}000000000,
          "nightTimeDuration": {{.settings.nightTimeDurationSeconds}}000000000,
          "fromHungerToStarving": {{.settings.fromHungerToStarvingSeconds}}000000000,
          "experienceCombatFactor": {{.settings.experienceCombatFactor}},
          "experienceMiningFactor": {{.settings.experienceMiningFactor}},
          "experienceExplorationQuestsFactor": {{.settings.experienceExplorationQuestsFactor}},
          "perkCostFactor": {{.settings.perkCostFactor}},
          "perkUpgradeRecyclingFactor": {{.settings.perkUpgradeRecyclingFactor}}
        },
        "userGroups": [
      {{- $prev := false}}
      {{- if .settings.adminPassword}}
          {
            "name": {{printf "%q" .settings.adminName}},
            "password": {{printf "%q" .settings.adminPassword}},
            "canKickBan": {{.settings.adminCanKickBan}},
            "canAccessInventories": {{.settings.adminCanAccessInventories}},
            "canEditWorld": {{.settings.adminCanEditWorld}},
            "canEditBase": {{.settings.adminCanEditBase}},
            "canExtendBase": {{.settings.adminCanExtendBase}},
            "reservedSlots": {{.settings.adminReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
      {{- if .settings.friendPassword}}
      {{- if $prev}},{{end}}
          {
            "name": {{printf "%q" .settings.friendName}},
            "password": {{printf "%q" .settings.friendPassword}},
            "canKickBan": {{.settings.friendCanKickBan}},
            "canAccessInventories": {{.settings.friendCanAccessInventories}},
            "canEditWorld": {{.settings.friendCanEditWorld}},
            "canEditBase": {{.settings.friendCanEditBase}},
            "canExtendBase": {{.settings.friendCanExtendBase}},
            "reservedSlots": {{.settings.friendReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
      {{- if .settings.guestPassword}}
      {{- if $prev}},{{end}}
          {
            "name": {{printf "%q" .settings.guestName}},
            "password": {{printf "%q" .settings.guestPassword}},
            "canKickBan": {{.settings.guestCanKickBan}},
            "canAccessInventories": {{.settings.guestCanAccessInventories}},
            "canEditWorld": {{.settings.guestCanEditWorld}},
            "canEditBase": {{.settings.guestCanEditBase}},
            "canExtendBase": {{.settings.guestCanExtendBase}},
            "reservedSlots": {{.settings.guestReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
      {{- if .settings.visitorPassword}}
      {{- if $prev}},{{end}}
          {
            "name": {{printf "%q" .settings.visitorName}},
            "password": {{printf "%q" .settings.visitorPassword}},
            "canKickBan": {{.settings.visitorCanKickBan}},
            "canAccessInventories": {{.settings.visitorCanAccessInventories}},
            "canEditWorld": {{.settings.visitorCanEditWorld}},
            "canEditBase": {{.settings.visitorCanEditBase}},
            "canExtendBase": {{.settings.visitorCanExtendBase}},
            "reservedSlots": {{.settings.visitorReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
      {{- if .settings.custom1Password}}
      {{- if $prev}},{{end}}
          {
            "name": {{printf "%q" .settings.custom1Name}},
            "password": {{printf "%q" .settings.custom1Password}},
            "canKickBan": {{.settings.custom1CanKickBan}},
            "canAccessInventories": {{.settings.custom1CanAccessInventories}},
            "canEditWorld": {{.settings.custom1CanEditWorld}},
            "canEditBase": {{.settings.custom1CanEditBase}},
            "canExtendBase": {{.settings.custom1CanExtendBase}},
            "reservedSlots": {{.settings.custom1ReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
      {{- if .settings.custom2Password}}
      {{- if $prev}},{{end}}
          {
            "name": {{printf "%q" .settings.custom2Name}},
            "password": {{printf "%q" .settings.custom2Password}},
            "canKickBan": {{.settings.custom2CanKickBan}},
            "canAccessInventories": {{.settings.custom2CanAccessInventories}},
            "canEditWorld": {{.settings.custom2CanEditWorld}},
            "canEditBase": {{.settings.custom2CanEditBase}},
            "canExtendBase": {{.settings.custom2CanExtendBase}},
            "reservedSlots": {{.settings.custom2ReservedSlots}}
          }
      {{- $prev = true}}
      {{- end}}
        ],
        "bans": []
      }
# A backup is the save data, not the 20 GB reinstallable install tree. Source:
# the enshrouded_server.json rendered above — "saveDirectory": "./savegame",
# resolved against the server's working directory (/data). The server config
# itself rides along so a restore comes back joinable; logDirectory ("./logs")
# is deliberately left out — those files grow mid-archive.
backup:
  include:
    - savegame/**
    - enshrouded_server.json
resources:
  min_memory_mb: 6144
  recommended_memory_mb: 16384
